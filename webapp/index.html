<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Uy Bor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --blue: #1a3c5e;
    --blue-mid: #2563a8;
    --blue-light: #e8f0fb;
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text2: #6e6e73;
    --border: #e5e5ea;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; background: var(--bg); font-family: -apple-system, 'SF Pro Display', BlinkMacSystemFont, sans-serif; color: var(--text); overflow: hidden; }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--blue);
    padding: 14px 16px 12px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-logo { display: flex; align-items: center; gap: 8px; }
  .topbar-icon { width: 32px; height: 32px; background: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .topbar-title { color: white; font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
  .topbar-sub { color: rgba(255,255,255,0.7); font-size: 11px; margin-top: 1px; }
  .topbar-badge { background: var(--green); color: white; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }

  /* ── SCROLL AREA ── */
  .page { display: none; height: calc(100vh - 118px); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(16px + var(--safe-bottom)); }
  .page.active { display: block; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding-bottom: var(--safe-bottom);
    z-index: 100;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 0 10px; cursor: pointer; transition: opacity .15s;
    border: none; background: none;
  }
  .nav-item:active { opacity: .6; }
  .nav-icon { font-size: 22px; margin-bottom: 3px; }
  .nav-label { font-size: 10px; font-weight: 500; color: var(--text2); }
  .nav-item.active .nav-label { color: var(--blue-mid); }
  .nav-item.active .nav-icon { filter: none; }

  /* ── SEARCH PAGE ── */
  .search-header { background: var(--blue); padding: 0 16px 16px; }
  .search-box {
    background: rgba(255,255,255,0.15);
    border-radius: 12px; padding: 10px 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .search-box input {
    background: none; border: none; outline: none; color: white;
    font-size: 15px; width: 100%; font-family: inherit;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.6); }
  .search-box-icon { font-size: 16px; opacity: .7; }

  .filter-scroll { overflow-x: auto; white-space: nowrap; padding: 12px 16px; scrollbar-width: none; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-chip {
    display: inline-block; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    background: var(--card); color: var(--text2); border: 1.5px solid var(--border);
    cursor: pointer; transition: all .15s; margin-right: 8px;
  }
  .filter-chip.active { background: var(--blue); color: white; border-color: var(--blue); }

  /* ── CARDS ── */
  .cards { padding: 4px 16px 8px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .card:active { transform: scale(0.985); box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .card-img { width: 100%; height: 190px; object-fit: cover; background: var(--blue-light); display: flex; align-items: center; justify-content: center; font-size: 48px; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 12px 14px 14px; }
  .card-price { font-size: 20px; font-weight: 700; color: var(--blue); margin-bottom: 2px; }
  .card-price span { font-size: 13px; font-weight: 500; color: var(--text2); }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card-loc { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    background: var(--blue-light); color: var(--blue-mid);
  }
  .tag.green { background: #e8f8ed; color: #1a7a35; }
  .tag.orange { background: #fff3e0; color: #c45c00; }
  .card-btn {
    width: 100%; margin-top: 12px; padding: 12px;
    background: var(--blue); color: white; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: opacity .15s;
  }
  .card-btn:active { opacity: .8; }

  /* ── SKELETON ── */
  .skeleton { background: linear-gradient(90deg, #f0f0f5 25%, #e5e5ea 50%, #f0f0f5 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 8px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .sk-card { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .sk-img { height: 190px; }
  .sk-body { padding: 14px; }
  .sk-line { height: 14px; margin-bottom: 10px; }
  .sk-line.short { width: 60%; }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 60px 32px; }
  .empty-icon { font-size: 56px; margin-bottom: 16px; }
  .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty-sub { font-size: 14px; color: var(--text2); line-height: 1.5; }

  /* ── ADD FORM ── */
  .form-section { background: var(--card); border-radius: var(--radius); margin: 12px 16px; overflow: hidden; }
  .form-row {
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .form-row:last-child { border-bottom: none; }
  .form-row-label { font-size: 15px; color: var(--text); }
  .form-row-val { font-size: 15px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .form-row-val .arrow { color: var(--border); font-size: 12px; }
  .form-input {
    padding: 12px 16px; font-size: 15px; color: var(--text);
    border: none; outline: none; width: 100%; font-family: inherit;
    background: none;
  }
  .form-input::placeholder { color: var(--text2); }
  .form-label { padding: 20px 16px 8px; font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .seg-control { display: flex; background: var(--border); border-radius: 9px; padding: 2px; margin: 0 16px 4px; }
  .seg-btn {
    flex: 1; padding: 7px; border-radius: 7px; border: none; background: none;
    font-size: 13px; font-weight: 500; color: var(--text2); cursor: pointer;
    font-family: inherit; transition: all .2s;
  }
  .seg-btn.active { background: white; color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .submit-btn {
    margin: 16px; width: calc(100% - 32px); padding: 16px;
    background: var(--blue); color: white; border: none; border-radius: var(--radius);
    font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer;
    transition: opacity .15s;
  }
  .submit-btn:active { opacity: .8; }

  /* ── MY LISTINGS ── */
  .my-card {
    background: var(--card); border-radius: var(--radius); margin: 0 16px 12px;
    padding: 14px; display: flex; gap: 12px; align-items: flex-start;
    box-shadow: 0 2px 8px rgba(0,0,0,.07); cursor: pointer;
    transition: transform .12s;
  }
  .my-card:active { transform: scale(0.985); }
  .my-card-thumb { width: 72px; height: 72px; border-radius: 10px; background: var(--blue-light); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .my-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .my-card-info { flex: 1; min-width: 0; }
  .my-card-price { font-size: 17px; font-weight: 700; color: var(--blue); }
  .my-card-title { font-size: 14px; color: var(--text); margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .my-card-loc { font-size: 12px; color: var(--text2); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .status-dot.active { background: var(--green); }
  .status-dot.inactive { background: var(--orange); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 200; display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    background: var(--card); border-radius: 20px 20px 0 0;
    width: 100%; padding: 0 0 calc(20px + var(--safe-bottom));
    transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-height: 90vh; overflow-y: auto;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 0; }
  .modal-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .modal-title { font-size: 17px; font-weight: 700; }
  .modal-price { font-size: 24px; font-weight: 800; color: var(--blue); margin-top: 4px; }
  .modal-body { padding: 16px; }
  .modal-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .modal-row:last-child { border-bottom: none; }
  .modal-row-icon { font-size: 18px; width: 28px; text-align: center; }
  .modal-row-text { flex: 1; }
  .modal-row-label { font-size: 11px; color: var(--text2); font-weight: 500; }
  .modal-row-val { font-size: 15px; color: var(--text); font-weight: 500; }
  .call-btn {
    display: block; width: calc(100% - 32px); margin: 0 16px;
    padding: 15px; background: var(--green); color: white; border: none; border-radius: var(--radius);
    font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer; text-align: center; text-decoration: none;
  }
  .modal-photos { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 16px; scrollbar-width: none; }
  .modal-photos::-webkit-scrollbar { display: none; }
  .modal-photo { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }

  /* ── PROFILE ── */
  .profile-avatar { width: 80px; height: 80px; border-radius: 40px; background: var(--blue-light); margin: 24px auto 12px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .profile-name { text-align: center; font-size: 20px; font-weight: 700; }
  .profile-phone { text-align: center; font-size: 15px; color: var(--text2); margin-top: 4px; }
  .profile-stats { display: flex; gap: 1px; margin: 20px 16px; background: var(--border); border-radius: var(--radius); overflow: hidden; }
  .stat-box { flex: 1; background: var(--card); padding: 16px 8px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 800; color: var(--blue); }
  .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 2px; }

  .section-header { padding: 20px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
  .section-title { font-size: 20px; font-weight: 700; }
  .section-link { font-size: 15px; color: var(--blue-mid); }

  .notif { background: #fff3cd; border-radius: 10px; padding: 12px 14px; margin: 0 16px 12px; font-size: 13px; color: #856404; display: flex; gap: 8px; align-items: flex-start; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">
    <div class="topbar-icon">🏠</div>
    <div>
      <div class="topbar-title">Uy Bor</div>
      <div class="topbar-sub">Maklerсiz uy toping</div>
    </div>
  </div>
  <div class="topbar-badge">Yangi</div>
</div>

<!-- PAGES -->

<!-- SEARCH -->
<div id="page-search" class="page active">
  <div class="search-header">
    <div class="search-box">
      <span class="search-box-icon">🔍</span>
      <input type="text" placeholder="Shahar, tuman, narx..." id="searchInput" oninput="filterCards()">
    </div>
  </div>
  <div class="filter-scroll">
    <span class="filter-chip active" onclick="setFilter('all',this)">Hammasi</span>
    <span class="filter-chip" onclick="setFilter('sale',this)">🏷 Sotish</span>
    <span class="filter-chip" onclick="setFilter('rent',this)">🔑 Ijara</span>
    <span class="filter-chip" onclick="setFilter('daily',this)">📅 Kunlik</span>
  </div>
  <div class="cards" id="cards-container">
    <!-- skeleton -->
    <div class="sk-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton"></div><div class="sk-line short skeleton"></div></div></div>
    <div class="sk-card"><div class="sk-img skeleton"></div><div class="sk-body"><div class="sk-line skeleton"></div><div class="sk-line short skeleton"></div></div></div>
  </div>
</div>

<!-- ADD -->
<div id="page-add" class="page">
  <div class="section-header"><div class="section-title">E'lon qo'shish</div></div>
  <div class="notif">ℹ️ E'loningiz admin tekshiruvidan o'tgach faollashadi.</div>

  <div class="form-label">E'lon turi</div>
  <div class="seg-control" id="seg-type">
    <button class="seg-btn active" onclick="segSelect('type',this,'sale')">Sotish</button>
    <button class="seg-btn" onclick="segSelect('type',this,'rent')">Ijara</button>
    <button class="seg-btn" onclick="segSelect('type',this,'daily')">Kunlik</button>
  </div>

  <div class="form-label">Ko'chmas mulk turi</div>
  <div class="seg-control" id="seg-prop">
    <button class="seg-btn active" onclick="segSelect('prop',this,'apartment')">Kvartira</button>
    <button class="seg-btn" onclick="segSelect('prop',this,'house')">Uy</button>
    <button class="seg-btn" onclick="segSelect('prop',this,'room')">Xona</button>
  </div>

  <div class="form-label">Joylashuv</div>
  <div class="form-section">
    <div class="form-row">
      <span class="form-row-label">Shahar</span>
      <div class="form-row-val">
        <select id="f-city" style="border:none;outline:none;font-size:15px;color:#6e6e73;font-family:inherit;background:none;-webkit-appearance:none;">
          <option value="Toshkent">Toshkent</option>
          <option value="Samarqand">Samarqand</option>
          <option value="Buxoro">Buxoro</option>
          <option value="Andijon">Andijon</option>
          <option value="Namangan">Namangan</option>
          <option value="Farg'ona">Farg'ona</option>
          <option value="Qo'qon">Qo'qon</option>
          <option value="Nukus">Nukus</option>
          <option value="Qarshi">Qarshi</option>
          <option value="Termiz">Termiz</option>
          <option value="other">Boshqa</option>
        </select>
        <span class="arrow">›</span>
      </div>
    </div>
    <div class="form-row" style="padding:0">
      <input class="form-input" id="f-district" placeholder="Tuman / manzil" type="text">
    </div>
  </div>

  <div class="form-label">Uy haqida</div>
  <div class="form-section">
    <div class="form-row" style="padding:0">
      <input class="form-input" id="f-rooms" placeholder="Xonalar soni (masalan: 3)" type="number" min="1" max="20">
    </div>
    <div class="form-row" style="padding:0">
      <input class="form-input" id="f-area" placeholder="Maydon m² (masalan: 65)" type="number" min="1">
    </div>
    <div class="form-row" style="padding:0">
      <input class="form-input" id="f-floor" placeholder="Qavat (ixtiyoriy)" type="number" min="1">
    </div>
  </div>

  <div class="form-label">Narx</div>
  <div class="form-section">
    <div class="form-row" style="padding:0 16px 0 0">
      <input class="form-input" id="f-price" placeholder="Narx" type="number" min="0" style="flex:1">
      <div class="seg-control" id="seg-currency" style="margin:0;width:120px;flex-shrink:0">
        <button class="seg-btn active" onclick="segSelect('currency',this,'USD')">USD</button>
        <button class="seg-btn" onclick="segSelect('currency',this,'UZS')">So'm</button>
      </div>
    </div>
  </div>

  <div class="form-label">Tavsif (ixtiyoriy)</div>
  <div class="form-section">
    <textarea class="form-input" id="f-desc" placeholder="Uy haqida qo'shimcha ma'lumot..." style="min-height:80px;resize:none;padding:14px 16px"></textarea>
  </div>

  <button class="submit-btn" onclick="submitListing()">📤 E'lon joylash</button>
</div>

<!-- MY -->
<div id="page-my" class="page">
  <div id="profile-box"></div>
  <div class="section-header"><div class="section-title">Mening e'lonlarim</div></div>
  <div id="my-listings-box"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="showPage('search',this)">
    <span class="nav-icon">🔍</span>
    <span class="nav-label">Qidirish</span>
  </button>
  <button class="nav-item" onclick="showPage('add',this)">
    <span class="nav-icon">➕</span>
    <span class="nav-label">E'lon</span>
  </button>
  <button class="nav-item" onclick="showPage('my',this)">
    <span class="nav-icon">👤</span>
    <span class="nav-label">Profil</span>
  </button>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); tg.setHeaderColor('#1a3c5e'); }

const API = 'https://uy-bor-bot.onrender.com';
const userId = tg?.initDataUnsafe?.user?.id || 0;

let allListings = [];
let currentFilter = 'all';
let formData = { type: 'sale', prop: 'apartment', currency: 'USD' };

// ── PAGE NAV ──
function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  if (name === 'search') loadListings();
  if (name === 'my') loadProfile();
}

// ── SEGMENT ──
function segSelect(key, el, val) {
  formData[key] = val;
  el.closest('.seg-control').querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// ── FILTER CHIPS ──
function setFilter(type, el) {
  currentFilter = type;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function filterCards() {
  renderCards();
}

// ── LOAD LISTINGS ──
async function loadListings() {
  if (allListings.length > 0) { renderCards(); return; }
  try {
    const r = await fetch(API + '/api/listings?limit=50');
    allListings = await r.json();
    renderCards();
  } catch {
    document.getElementById('cards-container').innerHTML = '<div class="empty"><div class="empty-icon">📡</div><div class="empty-title">Ulanib bo\'lmadi</div><div class="empty-sub">Internetni tekshiring</div></div>';
  }
}

// ── RENDER CARDS ──
function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = allListings.filter(l => {
    if (currentFilter !== 'all' && l.listing_type !== currentFilter) return false;
    if (q && !JSON.stringify(l).toLowerCase().includes(q)) return false;
    return true;
  });

  if (!list.length) {
    document.getElementById('cards-container').innerHTML = '<div class="empty"><div class="empty-icon">🏠</div><div class="empty-title">E\'lon topilmadi</div><div class="empty-sub">Boshqa filtr yoki shaharni sinab ko\'ring</div></div>';
    return;
  }

  const typeLabel = { sale: 'Sotish', rent: 'Ijara', daily: 'Kunlik' };
  const propIcon = { apartment: '🏢', house: '🏡', room: '🛏', commercial: '🏪' };
  const typeClass = { sale: 'green', rent: '', daily: 'orange' };

  document.getElementById('cards-container').innerHTML = list.map(l => {
    const price = l.price ? l.price.toLocaleString() + ' ' + (l.price_currency || 'USD') : '—';
    const photos = Array.isArray(l.photos) ? l.photos : [];
    const imgEl = photos.length
      ? `<div class="card-img"><img src="${API}/photo/${photos[0]}" onerror="this.parentNode.innerHTML='${propIcon[l.property_type] || '🏠'}'" loading="lazy"></div>`
      : `<div class="card-img">${propIcon[l.property_type] || '🏠'}</div>`;
    return `
    <div class="card" onclick="openListing(${l.id})">
      ${imgEl}
      <div class="card-body">
        <div class="card-price">${price}</div>
        <div class="card-title">${l.rooms ? l.rooms + ' xonali ' : ''}${l.property_type === 'apartment' ? 'kvartira' : l.property_type === 'house' ? 'uy' : l.property_type === 'room' ? 'xona' : 'mulk'}</div>
        <div class="card-loc">📍 ${l.city}${l.district ? ', ' + l.district : ''}</div>
        <div class="card-tags">
          <span class="tag ${typeClass[l.listing_type] || ''}">${typeLabel[l.listing_type] || l.listing_type}</span>
          ${l.area ? '<span class="tag">' + l.area + ' m²</span>' : ''}
          ${l.floor ? '<span class="tag">' + l.floor + '-qavat</span>' : ''}
          ${l.is_negotiable ? '<span class="tag orange">Kelishiladi</span>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── OPEN LISTING MODAL ──
function openListing(id) {
  const l = allListings.find(x => x.id === id);
  if (!l) return;
  const price = l.price ? l.price.toLocaleString() + ' ' + (l.price_currency || 'USD') : '—';
  const propName = { apartment: 'Kvartira', house: 'Uy', room: 'Xona', commercial: 'Tijorat' };
  const typeLabel = { sale: 'Sotish', rent: 'Ijara', daily: 'Kunlik ijara' };
  const photos = Array.isArray(l.photos) ? l.photos : [];

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <div class="modal-title">${l.rooms ? l.rooms + ' xonali ' : ''}${propName[l.property_type] || 'Mulk'}</div>
      <div class="modal-price">${price}</div>
    </div>
    ${photos.length ? '<div class="modal-photos">' + photos.map(p => `<img class="modal-photo" src="${API}/photo/${p}" onerror="this.style.display='none'" loading="lazy">`).join('') + '</div>' : ''}
    <div class="modal-body">
      <div class="modal-row"><span class="modal-row-icon">📍</span><div class="modal-row-text"><div class="modal-row-label">Manzil</div><div class="modal-row-val">${l.city}${l.district ? ', ' + l.district : ''}</div></div></div>
      ${l.area ? `<div class="modal-row"><span class="modal-row-icon">📐</span><div class="modal-row-text"><div class="modal-row-label">Maydon</div><div class="modal-row-val">${l.area} m²</div></div></div>` : ''}
      ${l.rooms ? `<div class="modal-row"><span class="modal-row-icon">🛏</span><div class="modal-row-text"><div class="modal-row-label">Xonalar</div><div class="modal-row-val">${l.rooms} xona</div></div></div>` : ''}
      ${l.floor ? `<div class="modal-row"><span class="modal-row-icon">🏗</span><div class="modal-row-text"><div class="modal-row-label">Qavat</div><div class="modal-row-val">${l.floor}${l.total_floors ? '/' + l.total_floors : ''}</div></div></div>` : ''}
      <div class="modal-row"><span class="modal-row-icon">🏷</span><div class="modal-row-text"><div class="modal-row-label">E'lon turi</div><div class="modal-row-val">${typeLabel[l.listing_type] || l.listing_type}</div></div></div>
      ${l.is_negotiable ? `<div class="modal-row"><span class="modal-row-icon">🤝</span><div class="modal-row-text"><div class="modal-row-label">Narx</div><div class="modal-row-val">Kelishish mumkin</div></div></div>` : ''}
      ${l.description_uz ? `<div class="modal-row"><span class="modal-row-icon">📝</span><div class="modal-row-text"><div class="modal-row-label">Tavsif</div><div class="modal-row-val">${l.description_uz}</div></div></div>` : ''}
    </div>
    ${l.contact_phone ? `<a class="call-btn" href="tel:${l.contact_phone}">📞 Qo'ng'iroq qilish</a>` : ''}
    <div style="height:16px"></div>
  `;
  document.getElementById('modal').classList.add('open');
  if (tg) tg.BackButton.show();
  if (tg) tg.BackButton.onClick(closeModalBtn);
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  _closeModal();
}
function closeModalBtn() { _closeModal(); }
function _closeModal() {
  document.getElementById('modal').classList.remove('open');
  if (tg) tg.BackButton.hide();
  if (tg) tg.BackButton.offClick(closeModalBtn);
}

// ── PROFILE ──
async function loadProfile() {
  const name = tg?.initDataUnsafe?.user?.first_name || 'Foydalanuvchi';
  const username = tg?.initDataUnsafe?.user?.username;
  document.getElementById('profile-box').innerHTML = `
    <div class="profile-avatar">👤</div>
    <div class="profile-name">${name}</div>
    ${username ? '<div class="profile-phone">@' + username + '</div>' : ''}
  `;

  if (!userId) {
    document.getElementById('my-listings-box').innerHTML = '<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">Kirish talab qilinadi</div><div class="empty-sub">Botni Telegram orqali oching</div></div>';
    return;
  }

  document.getElementById('my-listings-box').innerHTML = '<div class="empty"><div class="empty-icon">⏳</div></div>';
  try {
    const r = await fetch(API + '/api/listings?user_id=' + userId);
    const list = await r.json();
    if (!list.length) {
      document.getElementById('my-listings-box').innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">E\'lonlar yo\'q</div><div class="empty-sub">E\'lon qo\'shish uchun + tugmasini bosing</div></div>';
      return;
    }
    const propIcon = { apartment: '🏢', house: '🏡', room: '🛏', commercial: '🏪' };
    document.getElementById('my-listings-box').innerHTML = list.map(l => `
      <div class="my-card" onclick="openListing(${l.id})">
        <div class="my-card-thumb">${propIcon[l.property_type] || '🏠'}</div>
        <div class="my-card-info">
          <div class="my-card-price">${l.price ? l.price.toLocaleString() + ' ' + l.price_currency : '—'}</div>
          <div class="my-card-title">${l.city}, ${l.district || ''}</div>
          <div class="my-card-loc">${l.rooms ? l.rooms + ' xona · ' : ''}${l.area ? l.area + ' m²' : ''}</div>
        </div>
        <div class="status-dot ${l.status === 'active' ? 'active' : 'inactive'}"></div>
      </div>
    `).join('');
  } catch {
    document.getElementById('my-listings-box').innerHTML = '<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Xatolik</div></div>';
  }
}

// ── SUBMIT ──
async function submitListing() {
  const district = document.getElementById('f-district').value.trim();
  const rooms = document.getElementById('f-rooms').value;
  const area = document.getElementById('f-area').value;
  const price = document.getElementById('f-price').value;
  const city = document.getElementById('f-city').value;

  if (!district || !rooms || !area || !price) {
    if (tg) tg.showAlert('Barcha maydonlarni to\'ldiring!');
    else alert('Barcha maydonlarni to\'ldiring!');
    return;
  }

  const btn = document.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Yuborilmoqda...';

  try {
    const r = await fetch(API + '/api/listings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id: userId,
        listing_type: formData.type,
        property_type: formData.prop,
        city, district,
        rooms: parseInt(rooms),
        area: parseFloat(area),
        floor: parseInt(document.getElementById('f-floor').value) || null,
        price: parseFloat(price),
        price_currency: formData.currency,
        description_uz: document.getElementById('f-desc').value || null,
      })
    });
    if (r.ok) {
      if (tg) tg.showAlert('✅ E\'loningiz qabul qilindi! Admin tekshiruvidan o\'tgach faollashadi.');
      else alert('✅ E\'lon yuborildi!');
      // form reset
      ['f-district','f-rooms','f-area','f-floor','f-price','f-desc'].forEach(id => document.getElementById(id).value = '');
    } else {
      throw new Error();
    }
  } catch {
    if (tg) tg.showAlert('Xatolik yuz berdi. Botdan foydalaning.');
    else alert('Xatolik!');
  }
  btn.disabled = false;
  btn.textContent = '📤 E\'lon joylash';
}

// init
loadListings();
</script>
